<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User 2 — Chat Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; }

    .sidebar {
      width: 280px; background: #1e293b; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      border-right: 1px solid #334155;
    }
    .sidebar h2 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .badge { display: inline-block; background: #a855f7; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
    .badge.green { background: #22c55e; }

    input, textarea {
      width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; color: #e2e8f0; font-size: 13px; outline: none;
    }
    input:focus, textarea:focus { border-color: #a855f7; }

    button {
      width: 100%; padding: 9px; background: #a855f7; color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    button:hover { background: #9333ea; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }

    .main { flex: 1; display: flex; flex-direction: column; }

    .topbar {
      background: #1e293b; padding: 12px 20px; border-bottom: 1px solid #334155;
      display: flex; align-items: center; gap: 10px; font-weight: 600;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
    .dot.online { background: #22c55e; }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg.mine { background: #a855f7; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.theirs { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg .meta { font-size: 11px; opacity: 0.6; margin-bottom: 3px; }

    .typing-bar { padding: 6px 20px; font-size: 12px; color: #64748b; min-height: 24px; }

    .input-bar {
      padding: 12px 20px; background: #1e293b; border-top: 1px solid #334155;
      display: flex; gap: 10px;
    }
    .input-bar input { flex: 1; }
    .input-bar button { width: auto; padding: 8px 20px; }

    .log {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 8px; font-size: 11px; color: #64748b; height: 80px; overflow-y: auto;
    }
    .log .ok { color: #22c55e; }
    .log .err { color: #ef4444; }

    .divider { border: none; border-top: 1px solid #334155; margin: 4px 0; }
    .label { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .info-box { background: #0f172a; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #94a3b8; word-break: break-all; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div>
    <span class="badge">User 2 — Bob</span>
  </div>

  <hr class="divider">
  <h2>Auth</h2>

  <div>
    <div class="label">Email</div>
    <input id="email" value="bob@test.com" />
  </div>
  <div>
    <div class="label">Password</div>
    <input id="password" type="password" value="password123" />
  </div>
  <button onclick="register()">Register</button>
  <button class="secondary" onclick="login()">Login</button>

  <hr class="divider">
  <h2>Token</h2>
  <div class="info-box" id="tokenBox">—</div>

  <hr class="divider">
  <h2>Room</h2>
  <div>
    <div class="label">Room ID (paste from User 1)</div>
    <input id="roomIdInput" placeholder="paste room _id" />
  </div>
  <button onclick="joinRoom()">Join Room</button>

  <hr class="divider">
  <h2>Socket</h2>
  <button class="badge green" style="cursor:pointer;font-size:12px;width:auto;padding:4px 12px;" onclick="connectSocket()">Connect Socket</button>

  <hr class="divider">
  <h2>Log</h2>
  <div class="log" id="log"></div>

  <button class="danger" onclick="logout()">Logout</button>
</div>

<!-- MAIN CHAT -->
<div class="main">
  <div class="topbar">
    <div class="dot" id="connDot"></div>
    <span id="roomLabel">No room selected</span>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing-bar" id="typingBar"></div>

  <div class="input-bar">
    <input id="msgInput" placeholder="Type a message and press Enter…" onkeydown="handleKey(event)" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
<script>
  const BASE = 'http://localhost:3001/api';
  let token = null, currentRoomId = null, socket = null, myUsername = 'bob';
  let typingTimer = null;

  function log(msg, type = '') {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    line.className = type;
    line.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  async function apiFetch(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
    const res = await fetch(BASE + path, { ...options, headers });
    return res.json();
  }

  async function register() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const username = email.split('@')[0];
    myUsername = username;
    const data = await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
    if (data.success) {
      token = data.data.accessToken;
      myUsername = data.data.user.username;
      document.getElementById('tokenBox').textContent = token.slice(0, 40) + '…';
      log('✅ Registered as ' + myUsername, 'ok');
    } else {
      log('❌ ' + data.message, 'err');
    }
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const data = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    if (data.success) {
      token = data.data.accessToken;
      myUsername = data.data.user.username;
      document.getElementById('tokenBox').textContent = token.slice(0, 40) + '…';
      log('✅ Logged in as ' + myUsername, 'ok');
    } else {
      log('❌ ' + data.message, 'err');
    }
  }

  async function joinRoom() {
    const roomId = document.getElementById('roomIdInput').value.trim();
    const data = await apiFetch(`/rooms/${roomId}/join`, { method: 'POST' });
    if (data.success) {
      currentRoomId = roomId;
      document.getElementById('roomLabel').textContent = '# ' + (data.data.room.name || roomId);
      log('✅ Joined room', 'ok');
      if (socket?.connected) socket.emit('join_room', { roomId });
    } else {
      log('❌ ' + data.message, 'err');
    }
  }

  function connectSocket() {
    if (!token) return log('❌ Login first', 'err');
    if (socket?.connected) return log('Already connected');

    socket = io('http://localhost:3001', { auth: { token } });

    socket.on('connect', () => {
      document.getElementById('connDot').classList.add('online');
      log('🔌 Socket connected', 'ok');
      if (currentRoomId) socket.emit('join_room', { roomId: currentRoomId });
    });

    socket.on('new_message', (msg) => {
      appendMessage(msg.sender.username, msg.content, msg.sender.username === myUsername);
    });

    socket.on('user_typing', ({ username }) => {
      document.getElementById('typingBar').textContent = `${username} is typing…`;
    });

    socket.on('user_stopped_typing', () => {
      document.getElementById('typingBar').textContent = '';
    });

    socket.on('user_online', ({ userId }) => log('🟢 Online: ' + userId));
    socket.on('user_offline', ({ userId }) => log('🔴 Offline: ' + userId));
    socket.on('message_deleted', ({ messageId }) => log('🗑 Message deleted: ' + messageId));
    socket.on('error', (err) => log('❌ ' + err.message, 'err'));
    socket.on('disconnect', () => {
      document.getElementById('connDot').classList.remove('online');
      log('🔌 Disconnected');
    });
  }

  function appendMessage(username, content, mine) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'mine' : 'theirs');
    div.innerHTML = `<div class="meta">${username}</div>${content}`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !socket?.connected || !currentRoomId) return;
    socket.emit('send_message', { roomId: currentRoomId, content });
    input.value = '';
    socket.emit('typing_stop', { roomId: currentRoomId });
    clearTimeout(typingTimer);
  }

  function handleKey(e) {
    if (e.key === 'Enter') { sendMessage(); return; }
    if (!socket?.connected || !currentRoomId) return;
    socket.emit('typing_start', { roomId: currentRoomId });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit('typing_stop', { roomId: currentRoomId }), 1500);
  }

  async function logout() {
    await apiFetch('/auth/logout', { method: 'POST' });
    token = null;
    socket?.disconnect();
    document.getElementById('tokenBox').textContent = '—';
    log('👋 Logged out');
  }
</script>
</body>
</html>
